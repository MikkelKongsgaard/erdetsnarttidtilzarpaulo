<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'none'; connect-src 'none'"><title>Zar Paulo</title><style>
    :root {
      color-scheme: light;
      --bg: #f4f7ff;
      --panel: rgba(255,255,255,.82);
      --panel-strong: #ffffff;
      --text: #0f1527;
      --muted: #5f6f99;
      --blue: #2450ff;
      --blue-dark: #1633ad;
      --line: #bfd0ff;
      --shadow: rgba(36,80,255,.18);
      --black: #0a0d16;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(36,80,255,.10), transparent 32%),
        linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .52;
      background-image:
        linear-gradient(to right, rgba(36,80,255,.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(36,80,255,.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(36,80,255,.03) 50%, rgba(255,255,255,0) 100%);
      background-size: 100% 6px;
      mix-blend-mode: multiply;
      opacity: .55;
    }

    .top {
      padding: 20px clamp(18px, 5vw, 70px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
      border-bottom: 1px solid rgba(36,80,255,.18);
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(8px);
    }

    .mark {
      font-family: "Courier New", Courier, monospace;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--blue-dark);
    }

    .tag {
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 700;
      text-align: right;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 18px 60px;
      position: relative;
      z-index: 1;
    }

    .shell {
      width: min(1100px, 100%);
      border: 2px solid var(--blue);
      background: rgba(255,255,255,.72);
      box-shadow: 10px 10px 0 var(--shadow);
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      overflow: hidden;
    }

    .main-panel {
      padding: clamp(26px, 4vw, 46px);
      border-right: 2px solid rgba(36,80,255,.18);
      text-align: center;
    }

    .side-panel {
      padding: clamp(18px, 3vw, 26px);
      background: linear-gradient(180deg, rgba(36,80,255,.04), rgba(36,80,255,.09));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--blue);
    }

    h1 {
      font-family: Impact, "Arial Black", sans-serif;
      text-transform: uppercase;
      font-size: clamp(42px, 7vw, 110px);
      line-height: .94;
      letter-spacing: -.03em;
      margin: 0;
      text-wrap: balance;
    }

    h1 span { color: var(--blue); }

    .answer-wrap {
      margin: 24px auto 14px;
      width: min(760px, 100%);
      border: 2px solid var(--blue);
      background: var(--panel-strong);
      box-shadow: 6px 6px 0 var(--shadow);
      padding: 18px 18px 16px;
    }

    .status-line {
      font-family: "Courier New", Courier, monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .answer {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(28px, 4.8vw, 62px);
      line-height: 1.02;
      letter-spacing: .01em;
      text-transform: uppercase;
      color: var(--blue);
      margin: 0;
    }

    .sub {
      color: var(--muted);
      font-size: clamp(13px, 1.5vw, 17px);
      margin: 14px 0 22px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.6vw, 16px);
      width: min(760px, 100%);
      margin: 0 auto 24px;
    }

    .unit {
      background: var(--panel-strong);
      border: 2px solid var(--blue);
      padding: clamp(14px, 2.3vw, 22px) 6px 14px;
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .num {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(30px, 6vw, 68px);
      line-height: 1;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: clamp(9px, 1.3vw, 12px);
      letter-spacing: .14em;
      color: var(--blue-dark);
      margin-top: 10px;
      text-transform: uppercase;
    }

    .event {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      cursor: pointer;
      color: #fff;
      background: var(--blue);
      border: 2px solid var(--blue);
      padding: 14px 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      transition: transform .18s, box-shadow .18s;
      box-shadow: 4px 4px 0 var(--black);
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--black);
    }

    .panel-box {
      border: 2px solid rgba(36,80,255,.24);
      background: rgba(255,255,255,.72);
      padding: 14px 14px 12px;
    }

    .panel-title {
      margin: 0 0 10px;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--blue-dark);
    }

    .code {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-line;
    }

    .mini-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 2px solid rgba(36,80,255,.20);
      background: rgba(255,255,255,.78);
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(36,80,255,.14);
      flex: 0 0 auto;
    }

    footer {
      text-align: center;
      padding: 16px 20px 22px;
      color: #66739c;
      font-size: 11px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .main-panel { border-right: 0; border-bottom: 2px solid rgba(36,80,255,.18); }
    }

    @media (max-width: 500px) {
      .top { padding: 18px 16px; }
      .mark { font-size: 13px; }
      .tag { font-size: 9px; }
      .countdown { gap: 7px; }
      .unit { padding: 16px 4px 12px; box-shadow: 3px 3px 0 var(--shadow); }
      .label { letter-spacing: .05em; font-size: 8px; }
      .answer-wrap { padding: 14px 12px 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  html,body{height:100%;overflow:hidden}main{padding:3vw}.shell{display:block;width:90%;max-width:1100px}.main-panel{border:0;padding:3vw}h1{font-size:clamp(24px,6vw,80px)}.answer{font-size:clamp(16px,3vw,42px)}.num{font-size:clamp(20px,6vw,68px)}.event{margin:0;font-size:clamp(9px,1.5vw,15px)}.sub{margin:12px 0}.countdown{margin-bottom:14px}@media(max-height:300px){h1,.sub,.event,.status-line{display:none}.answer-wrap{margin:8px auto;padding:5px}.unit{padding:8px 3px}.label{margin-top:4px}}</style></head><body><main><section class="shell"><div class="main-panel"><h1>ER DET SNART TID TIL <span>ZAR PAULO?</span></h1><div class="answer-wrap"><div class="status-line">SYSTEMSTATUS // OFFLINE</div><div id="answer" class="answer">INITIALISERER…</div></div><p class="sub" id="sub"></p><section class="countdown"><div class="unit"><div class="num" id="days">--</div><div class="label">Dage</div></div><div class="unit"><div class="num" id="hours">--</div><div class="label">Timer</div></div><div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutter</div></div><div class="unit"><div class="num" id="seconds">--</div><div class="label">Sekunder</div></div></section><p class="event">19. november 2027 · 20.00 Europe/Copenhagen<br>Djurslands Bank Arena · Aarhus</p></div></section></main><script src="countdown.js"></script></body></html>
